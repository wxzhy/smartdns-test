# 可启动的最小部署配置：仅监听本机 5335，不依赖地理数据或 libsodium。
# 1.1.1.1 只是示例上游；接入 dnsmasq 前须在路由器上确认它可达，
# 否则换成 WAN 提供的可达 DNS。不要换成会回指本服务的 127.0.0.1。
# 对外开放服务前，请确认监听地址、上游及访问控制符合自己的网络环境。
worker_count: 1

listeners:
  - name: local-udp
    type: udp
    host: 127.0.0.1
    port: 5335
    timeout: 5
  - name: local-tcp
    type: tcp
    host: 127.0.0.1
    port: 5335
    timeout: 5

nameservers:
  - name: upstream-udp
    type: udp
    address: 1.1.1.1
    port: 53
    timeout: 2

resolvers:
  - name: upstream
    type: plain
    nameservers: [upstream-udp]
    lifetime: 3

routing:
  - name: default
    resolver: upstream
