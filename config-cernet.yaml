worker_count: 1
listeners:
  - name: TCP
    type: tcp
    port: 5335
    timeout: 5
  - name: UDP
    type: udp
    host: "::"
    port: 5335
    timeout: 5
geodata:
  geoip: tags/output/geoip.metadb
  geosite: tags/output/geosite.trie
  asn: tags/output/asn.mmdb
  ipset: tags/output/geoip.radix
client:
  dns_cache_ttl: 300
  shuffle: true
  resolver:
    name: 114dns
    type: aiodns
    nameservers:
      - 114.114.114.114
      - 114.114.115.115
      # - test-udp
    timeout: 1
    tries: 4
  hosts:
    dns.cloudflare.com:
      - "2606:4700:10::"
      - "2606:4700:20::"
    dns.nextdns.io:
      - "2606:4700:10::"
      - "2606:4700:20::"
    www.baidu.com:
      - "2001:300::5"
      - "2001:300::6"
    www.sina.com:
      - "2001:b000:168::1"
      - "2001:b000:168::2"

nameservers:
  - name: test-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
    use_tricks: true
    timeout: 5
  - name: google-1
    type: udp
    address: 2001:4860:4860::8888
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-2
    type: udp
    address: 2001:4860:4860::8844
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-3
    type: udp
    address: 216.239.34.34
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-4
    type: udp
    address: 216.239.36.36
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: curl-doh
    type: curl
    url: https://jxl61mtx82.cloudflare-gateway.com/dns-query
    host: jxl61mtx82.cloudflare-gateway.com
    want_get: false
    verify: true
    ech: crypto.cloudflare.com
  - name: v-dns
    type: curl
    url: https://v.recipes/dns-ecs
    host: v.recipes
    want_get: false
    verify: true
    ech: crypto.cloudflare.com
  - name: nextdns
    type: curl
    url: https://dns.nextdns.io/394f12
    host: dns.nextdns.io
    want_get: false
    verify: true
    ech: crypto.cloudflare.com
  - name: iij
    type: curl
    url: https://www.baidu.com/dns-query
    host: public.dns.iij.jp
    want_get: false
    verify: false
  - name: hinet
    type: curl
    url: https://www.sina.com/dns-query
    host: dns.hinet.net
    want_get: false
    verify: false
resolvers:
  - name: 114dns
    type: aiodns
    nameservers:
      - 114.114.114.114
      - 114.114.115.115
      # - test-udp
    timeout: 1
    tries: 4
  - name: dnspod
    type: aiodns
    nameservers:
      - 119.29.29.29
      - 119.28.28.28
      # - test-udp
    timeout: 1
    tries: 4
  - name: trafficroute
    type: aiodns
    nameservers:
      - 180.184.1.1
      - 180.184.2.2
      # - test-udp
  - name: telecom
    type: aiodns
    nameservers:
      - 218.2.2.2
      - 218.4.4.4
    timeout: 1
    tries: 4
  - name: unicom
    type: aiodns
    nameservers:
      - 221.6.4.66
      - 58.240.57.33
    timeout: 1
    tries: 4
  - name: cmcc
    type: aiodns
    nameservers:
      - 221.131.143.69
      - 221.131.143.70
    timeout: 1
    tries: 4
  - name: opennic
    type: aiodns
    nameservers:
      - 2a01:4f9:2b:1305::2
      - 2a01:4f9:c011:83d::1
      # - test-udp
    tcp: true
    timeout: 2
    tries: 4
  - name: doh-test
    type: plain
    nameservers:
      - curl-doh
  - name: nextdns
    type: plain
    nameservers:
      - nextdns
  - name: hinet
    type: plain
    nameservers:
      - hinet
  - name: iij
    type: plain
    nameservers:
      - iij
  - name: google-cn
    type: plain
    nameservers:
      - google-1
      - google-2
    ecs: 240b:4001:23c::/48
    timeout: 3
    lifetime: 5
  - name: cn
    type: concurrent
    resolvers:
      - telecom
      - unicom
      - cmcc
      - dnspod
      - 114dns
    timeout: 2
    wait_all: true
    actions:
      - filter
      - speedcheck
  - name: global
    type: concurrent
    resolvers:
      - doh-test
      - nextdns
    wait_all: true
    actions:
      - replace
      - speedcheck
    timeout: 5
  - name: default
    type: concurrent
    resolvers:
      - telecom
      - unicom
      - cmcc
      - dnspod
      - 114dns
      - doh-test
      - nextdns
    wait_all: true
    actions:
      - filter
      - replace
      - speedcheck
    timeout: 5

actions:
  - name: block
    type: static
  - name: proxy
    type: static
    ipv4:
      - 192.168.8.64
    ipv6:
      # 测试占位地址；实际运行时替换为可达的代理 IPv6 地址。
      - 2001:db8::64
  - name: speedcheck
    type: speedcheck
    # 标签倍率优先于 ASN 倍率；均未命中时为 1。
    tag_multipliers: {}
    asn_multipliers: {}
    match_ip:
      ip_exclude:
        - private
  - name: replace
    type: replace
    match_name:
      domain_exclude:
        - mozilla
        - cn
        - "@cn"
        - cloudflare-cn
        - google-cn
        - category-ntp
        - category-stun
      query_types:
        - A
        - AAAA
    replace_map:
      - match_ip:
          ip_include:
            - cloudflare
        ipv4:
          - 172.64.145.0
          - 172.64.146.0
          - 104.18.38.0
          - 104.18.39.0
        ipv6:
          - "2606:4700:10::"
          - "2606:4700:20::"
      - match_ip:
          ip_include:
            - cloudfront
        ipv4:
          - 3.168.241.0
          - 13.225.167.0
          - 3.175.219.0
          - 13.33.212.0
          - 3.166.246.0
        ipv6:
          - "2600:9000:2939::"
          - "2600:9000:2079::"
      - match_ip:
          ip_include:
            - github-raw
        ipv4:
          - 146.75.50.132
          - 146.75.49.55
          - 146.75.48.133
          - 146.75.50.217
          - 146.75.49.91
        ipv6:
          - "2a04:4e42:200::133"
          - "2a04:4e42:400::311"
          - "2a04:4e42:600::347"
      - match_ip:
          ip_include:
            - fastly
          ip_exclude:
            - github
        ipv4_prefixlen: 22
        ipv6_prefixlen: 64
        ipv4:
          - 146.75.48.0
        ipv6:
          - "2a04:4e42:200::"
          - "2a04:4e42:400::"
          - "2a04:4e42:600::"
  - name: https
    type: https
    match_name:
      domain_exclude:
        - cn
        - "@cn"
    match_ip:
      ip_include:
        - cloudflare
    ech_domain: crypto.cloudflare.com
  - name: fallback
    type: fallback
    map:
      - match_name:
          domain_include:
            - google
          domain_exclude:
            - google-cn
            - googlefcm
            - category-ntp
            - category-stun
        ipv6:
          - "2404:6800:4005:800::93"
          - "2404:6800:4005:c02::94"
          - "2404:6800:4005:c00::2008"
          - "2404:6800:4005:c02::2018"
          - "2404:6800:4005:c02::ca"
          - "2404:6800:4005:800::b5"
  - name: filter
    type: filter
    filters:
      - match_name:
          domain_exclude:
            - facebook
            - dropbox
        match_ip:
          ip_exclude:
            - facebook
            - twitter
          asn_exclude:
            - 19679
routing:
  - name: ads
    before:
      - block
    resolver: cn
    matcher:
      domain_include:
        - category-ads-all
        - category-ads
        - ads
        - "@ads"
  - name: proxy
    before:
      - proxy
    resolver: cn
    matcher:
      # 修改 tags/geosite/proxy.txt 后须重新生成 geosite.trie。
      domain_include:
        - proxy
      query_types:
        - A
        - AAAA
  - name: google
    matcher:
      domain_include:
        - google-cn
    resolver: google-cn
    after:
      - https
  - name: rule1
    resolver: cn
    matcher:
      domain_include:
        - cn
        - "@cn"
        - google-cn
        - apple-cn
    after:
      - speedcheck
      - https
  #    resolver: doh-test
  - name: rule3
    matcher:
      domain_include:
        - google
        - gfw
    after:
      - filter
      - speedcheck
      - fallback
      - https
    resolver: global
  - name: opennic
    matcher:
      domain_include:
        - tld-opennic
    resolver: opennic
  - name: default
    after:
      - filter
      - speedcheck
      - fallback
      - https
    resolver: default
