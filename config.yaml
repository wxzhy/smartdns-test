worker_count: 1
listeners:
  - name: TCP
    type: tcp
    port: 5335
    timeout: 5
  - name: UDP
    type: udp
    host: "::"
    port: 5335
    timeout: 5
geodata:
  geoip: tags/output/geoip.metadb
  geosite: tags/output/geosite.trie
  asn: tags/output/asn.mmdb
client:
  dns_cache_ttl: 300
  shuffle: true
  resolver:
    name: 114dns
    type: aiodns
    nameservers:
      - 114.114.114.114
      - 114.114.115.115
      # - test-udp
    timeout: 1
    tries: 4
  hosts:
    dns.cloudflare.com:
      - 162.159.38.0
      - 162.159.39.0
      - 162.159.44.0
      - 162.159.45.0
      - "2606:4700:52::"
      - "2606:4700:57::"
      - "2606:4700:5a::"

nameservers:
  - name: test-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
    use_tricks: true
    timeout: 5
  - name: google-1
    type: udp
    address: 8.8.8.8
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-2
    type: udp
    address: 8.8.4.4
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-3
    type: udp
    address: 216.239.34.34
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-4
    type: udp
    address: 216.239.36.36
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: curl-doh
    type: curl
    url: https://jxl61mtx82.cloudflare-gateway.com/dns-query
    host: jxl61mtx82.cloudflare-gateway.com
    want_get: false
    verify: true
    ech: crypto.cloudflare.com
resolvers:
  - name: 114dns
    type: aiodns
    nameservers:
      - 114.114.114.114
      - 114.114.115.115
      # - test-udp
    timeout: 1
    tries: 4
  - name: dnspod
    type: aiodns
    nameservers:
      - 119.29.29.29
      - 119.28.28.28
      # - test-udp
    timeout: 1
    tries: 4
  - name: trafficroute
    type: aiodns
    nameservers:
      - 180.184.1.1
      - 180.184.2.2
      # - test-udp
    timeout: 1
    tries: 4
  - name: google-1
    type: plain
    nameservers:
      - google-1
      - google-2
    timeout: 3
    lifetime: 5
  - name: google-2
    type: plain
    nameservers:
      - google-3
      - google-4
    timeout: 3
    lifetime: 5
  - name: doh-test
    type: plain
    nameservers:
      - curl-doh
  - name: doh-goog
    type: plain
    nameservers:
      - curl-doh
    ecs: 2409:8020:2000::/48
    timeout: 3
    lifetime: 5
  - name: google
    type: concurrent
    resolvers:
      - google-1
      - google-2
    timeout: 5
  - name: cn
    type: concurrent
    resolvers:
      - trafficroute
      - dnspod
      - 114dns
    timeout: 2
  - name: global
    type: concurrent
    resolvers:
      - google
      - doh-test
    actions:
      - replace
      - speedcheck
    timeout: 2

actions:
  - name: block
    type: static
  - name: speedcheck
    type: speedcheck


  - name: replace
    type: replace
    match_name:
      domain_exclude:
        - mozilla
        - github
        - cn
        - cloudflare-cn
        - google-cn
        - category-ntp
        - category-stun
        - category-ads
        - cloudflare-cn
      query_types:
        - A
        - AAAA
    replace_map:
      - match_ip:
          ip_include:
            - cloudflare
        ipv4:
          - 162.159.38.0
          - 162.159.39.0
          - 162.159.44.0
          - 162.159.45.0
        ipv6:
          - "2606:4700:52::"
          - "2606:4700:57::"
          - "2606:4700:5a::"
      - match_ip:
          ip_include:
            - fastly
        ipv4_prefixlen: 22
        ipv6_prefixlen: 64
        ipv4:
          - 146.75.48.0
        ipv6:
          - "2a04:4e42:7c::"
