listeners:
  - name: TCP
    type: tcp
    port: 5335
    timeout: 5
  - name: UDP
    type: udp
    host: "::"
    port: 5335
    timeout: 5
geodata:
  geoip: tags/output/geoip.metadb
  geosite: tags/output/geosite.trie
  asn: tags/output/asn.mmdb
nameservers:
  - name: test-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
    use_tricks: true
    timeout: 5
  - name: test-udp
    type: udp
    address: 8.8.8.8
    port: 53
    repeat: 1
    use_tricks: true
    timeout: 5
resolvers:
  - name: test1
    type: plain
    nameservers:
      - test-tcp
      # - test-udp
    timeout: 5
    lifetime: 10
  - name: test2
    type: plain
    nameservers:
      - test-udp
      # - test-udp
    timeout: 5
    lifetime: 10
  - name: test3
    type: concurrent
    resolvers:
      - test1
      - test2
    timeout: 5
