listeners:
  - name: TCP
    type: tcp
    port: 5335
    timeout: 5
  - name: UDP
    type: udp
    host: "::"
    port: 5335
    timeout: 5
nameservers:
  - name: test-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
  - name: test-udp
    type: udp
    address: 8.8.8.8
    port: 53
resolvers:
  - name: test
    type: plain
    nameservers:
      - test
