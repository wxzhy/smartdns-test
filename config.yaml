listeners:
  - name: TCP
    type: tcp
    port: 5335
    timeout: 5
  - name: UDP
    type: udp
    host: "::"
    port: 5335
    timeout: 5
geodata:
  geoip: tags/output/geoip.metadb
  geosite: tags/output/geosite.trie
  asn: tags/output/asn.mmdb
nameservers:
  - name: test-tcp
    type: tcp
    address: 8.8.8.8
    port: 53
    use_tricks: true
    timeout: 5
  - name: google-1
    type: udp
    address: 8.8.8.8
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-2
    type: udp
    address: 8.8.4.4
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-3
    type: udp
    address: 216.239.34.34
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
  - name: google-4
    type: udp
    address: 216.239.36.36
    port: 53
    repeat: 0
    use_tricks: true
    timeout: 3
resolvers:
  - name: 114dns
    type: aiodns
    nameservers:
      - 114.114.114.114
      - 114.114.115.115
      # - test-udp
    timeout: 1
    tries: 4
  - name: dnspod
    type: aiodns
    nameservers:
      - 119.29.29.29
      - 119.28.28.28
      # - test-udp
    timeout: 1
    tries: 4
  - name: trafficroute
    type: aiodns
    nameservers:
      - 180.184.1.1
      - 180.184.2.2
      # - test-udp
    timeout: 1
    tries: 4
  - name: google-1
    type: plain
    nameservers:
      - google-1
      - google-2
    timeout: 3
    lifetime: 5
  - name: google-2
    type: plain
    nameservers:
      - google-3
      - google-4
    timeout: 3
    lifetime: 5
  - name: google
    type: concurrent
    resolvers:
      - google-1
      - google-2
    timeout: 5
  - name: cn
    type: concurrent
    resolvers:
      - trafficroute
      - dnspod
      - 114dns
    timeout: 2
routing:
  - name: rule1
    resolver: cn
    domain_include:
      - cn
      - google-cn
  - name: rule2
    resolver: google
