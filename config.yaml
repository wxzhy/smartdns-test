routing:
  - name: ads
    before:
      - block
    resolver: cn
    matcher:
      domain_include:
        - category-ads-all
        - category-ads
  - name: rule-google
    resolver: doh-goog
    matcher:
      domain_include:
        - google-cn
  - name: rule1
    resolver: cn
    matcher:
      domain_include:
        - cn
  - name: rule2
    matcher:
      domain_include:
        - google
    #    after:
    #      - fallback
    resolver: doh-test
  - name: rule3
    after:

      - speedcheck
    resolver: global
