[project]
name = "smartdns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiodns>=4.0.4",
    "aiofastnet==1.0.3",
    "anyio>=4.14.2",
    "betterproto2>=0.10.0",
    "cachetools-async>=0.0.5",
    "curl-cffi==0.16.0",
    "dnspython[doh,idna]>=2.8.0",
    "generic-connection-pool>=0.8.1",
    "loguru>=0.7.3",
    "marisa-trie>=1.4.1",
    "maxminddb>=3.1.1",
    "py-radix>=1.1.0",
    "pydantic-settings[yaml]>=2.14.2",
    "typer==0.27.1",
    "ujson>=5.13.0",
    "winuvloop>=0.2.4",
]
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "B",
    "UP",
    "SIM",
    "C4",
    "ASYNC",
    "RUF",
    "PT",
    "TID",
    "PTH",
    "PERF",
    "FURB",
    "RET",
    "TC",
    "PLC",
    "PLE",
    "PLW",
    "PIE",
    "COM",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "COM812",
    # dnspython 后端 Socket ABC 与 Nameserver.async_query 接口签名强制带 timeout 参数，
    # ASYNC109 在本 DNS 代理中系统性误报，统一禁用。
    "ASYNC109",
]

[tool.ruff.lint.flake8-type-checking]
# pydantic 模型/数据类在运行期需要字段注解来构建校验器（3.14 惰性注解下访问
# __annotations__ 会触发求值），故其字段类型导入不得移入 TYPE_CHECKING。
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = ["pydantic.dataclasses.dataclass"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "betterproto2-compiler>=0.10.1",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.1",
    "ty==0.0.66",
]
